</div>
<div class="contact">
  <div class="c-list">
    <a class="card c-row tilt" href="mailto:aswinkanil21@gmail.com"><span class="ico">&#9993;</span><span><small>Email</small><b>aswinkanil21@gmail.com</b></span></a>

  <form class="card" id="contactForm">
    <label>Your name<input name="name" required autocomplete="name"></label>

    <label>Message<textarea name="message" required></textarea></label>
    <button class="btn primary" type="submit" style="justify-content:center">Send message</button>
    <p class="muted" style="font-size:.9rem">This opens your email app with the message ready to send.</p>
